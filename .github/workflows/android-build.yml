name: Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Run unit and Robolectric tests
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build Android App Bundle (AAB)
      run: ./gradlew bundleDebug --no-daemon --stacktrace

    - name: Verify APK Exists & Size Check
      run: |
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "ERROR: APK not found at $APK_PATH"
          exit 1
        fi
        
        FILESIZE=$(stat -c%s "$APK_PATH")
        echo "Generated APK size: $FILESIZE bytes"
        
        # Verify greater than 1MB (1048576 bytes)
        if [ "$FILESIZE" -lt 1048576 ]; then
          echo "ERROR: APK size ($FILESIZE bytes) is suspiciously small or 0 bytes!"
          exit 1
        fi
        
        echo "APK verification passed ($FILESIZE bytes)."

    - name: Copy APK to requested download locations
      run: |
        mkdir -p APK_DOWNLOAD
        mkdir -p .build-outputs
        cp -v app/build/outputs/apk/debug/app-debug.apk APK_DOWNLOAD/app-debug.apk
        cp -v app/build/outputs/apk/debug/app-debug.apk .build-outputs/app-debug.apk
        echo "Copied APK to:"
        echo "  APK_DOWNLOAD/app-debug.apk ($(stat -c%s APK_DOWNLOAD/app-debug.apk) bytes)"
        echo "  .build-outputs/app-debug.apk ($(stat -c%s .build-outputs/app-debug.apk) bytes)"

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wafa-PDF-Debug-APK
        path: APK_DOWNLOAD/app-debug.apk
        retention-days: 30

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wafa-PDF-Bundle-AAB
        path: app/build/outputs/bundle/debug/*.aab
        retention-days: 30
